<html lang="en">

<style>
/* Layout: phone-first single column. One neon gradient hero per tab, white lists below, emoji tiles in neon. Light only, by request. */
:root {
  --bg: #FFFFFF;
  --soft: #F5F4FA;
  --line: #EEEDF4;
  --ink: #15121F;
  --ink-2: #66637A;
  --ink-3: #A3A0B5;
  --pink: #FF2E93;
  --pink-deep: #D10F6E;
  --violet: #8B5CFF;
  --cyan: #18D2F2;
  --lime: #B4F03A;
  --orange: #FF8A1F;
  --yellow: #FFD43B;
  --blue: #2F6FD6;
  --glow: linear-gradient(135deg, #FF2E93 0%, #8B5CFF 55%, #18C8F5 100%);
  --display: "Unbounded", "Arial Black", system-ui, sans-serif;
  --body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font: 16px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--violet); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: -.02em; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 17px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); font-size: 14.5px; }
.faint { color: var(--ink-3); font-size: 13.5px; }

.app {
  max-width: 480px; margin: 0 auto;
  padding-left: max(18px, env(safe-area-inset-left, 0px));
  padding-right: max(18px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(150px + env(safe-area-inset-bottom, 0px));
}
#view { display: grid; gap: 24px; }
.sec { display: grid; gap: 10px; }

.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font-family: var(--display); font-weight: 800; font-size: 18px; letter-spacing: -.02em; background: var(--glow); -webkit-background-clip: text; background-clip: text; color: transparent; }
.spark { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: 99px; background: var(--ink); color: #fff; font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; }
.spark .dotb { width: 8px; height: 8px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 8px var(--lime); }

.dateRow { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: -8px; }
.dateRow .t { min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--pink-deep); }
.arrows { display: flex; gap: 6px; flex: none; }
.arrow { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--soft); color: var(--ink-2); font-size: 18px; }
.arrow[disabled] { opacity: .3; cursor: default; }
.back { font-weight: 700; font-size: 14px; color: var(--violet); text-decoration: underline; text-underline-offset: 3px; margin-top: -14px; justify-self: start; }

.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 18px; background: var(--glow); color: #fff; display: grid; gap: 14px; box-shadow: 0 14px 34px -12px rgba(139, 92, 255, .55); }
.hero::after { content: ""; position: absolute; width: 220px; height: 220px; right: -70px; top: -90px; border-radius: 50%; background: radial-gradient(circle, rgba(255,255,255,.35), transparent 65%); pointer-events: none; }
.hero > * { position: relative; z-index: 1; }
.hrow { display: flex; align-items: center; gap: 16px; }
.ring { flex: none; width: 92px; height: 92px; position: relative; }
.ring svg { width: 92px; height: 92px; transform: rotate(-90deg); }
.ring .tr { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 9; }
.ring .pr { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.ring .c { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; line-height: 1.05; }
.ring .c b { font-family: var(--display); font-size: 21px; font-weight: 700; display: block; }
.ring .c span { font-size: 11.5px; font-weight: 600; opacity: .9; }
.hinfo { display: grid; gap: 6px; min-width: 0; }
.typechip { justify-self: start; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 99px; background: rgba(255,255,255,.22); font-weight: 800; font-size: 14px; color: #fff; }
.typechip i { font-style: normal; opacity: .8; font-weight: 600; }
.hinfo .l { font-size: 14.5px; font-weight: 600; }
.next { display: grid; gap: 7px; padding: 12px 14px; border-radius: 16px; background: rgba(255,255,255,.18); font-size: 14px; font-weight: 600; text-align: left; color: #fff; width: 100%; }
.next .nb, .lvl .nb { height: 6px; border-radius: 6px; background: rgba(255,255,255,.3); overflow: hidden; }
.next .nb i, .lvl .nb i { display: block; height: 100%; border-radius: 6px; background: #fff; }
.daynote { font-size: 14px; color: var(--ink-2); margin-top: -10px; }

.alert { display: grid; gap: 10px; padding: 14px 16px; border-radius: 20px; background: #FFF0F7; box-shadow: inset 0 0 0 2px var(--pink); }
.alert p { font-weight: 800; color: var(--pink-deep); }

.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.rowbtn, .rowbox { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 6px; text-align: left; border-radius: 18px; }
.rowbtn:active { background: var(--soft); }
.tile { flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; font-size: 23px; line-height: 1; }
.t-pink { background: var(--pink); box-shadow: 0 6px 16px -6px var(--pink); }
.t-violet { background: var(--violet); box-shadow: 0 6px 16px -6px var(--violet); }
.t-cyan { background: var(--cyan); box-shadow: 0 6px 16px -6px var(--cyan); }
.t-lime { background: var(--lime); box-shadow: 0 6px 16px -6px var(--lime); }
.t-orange { background: var(--orange); box-shadow: 0 6px 16px -6px var(--orange); }
.t-yellow { background: var(--yellow); box-shadow: 0 6px 16px -6px var(--yellow); }
.txt { flex: 1; min-width: 0; display: grid; gap: 1px; }
.nm { font-weight: 700; font-size: 16.5px; }
.sub { font-size: 14px; color: var(--ink-2); }
.pts { flex: none; font-size: 13px; font-weight: 800; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ck { flex: none; width: 30px; height: 30px; border-radius: 50%; box-shadow: inset 0 0 0 2px #D9D6E6; display: grid; place-items: center; color: transparent; transition: background .15s, box-shadow .15s; }
.ck svg { width: 16px; height: 16px; }
.done .ck { background: var(--pink); box-shadow: 0 0 0 4px #FFE0EF, 0 0 14px rgba(255,46,147,.55); color: #fff; }
.done .nm { color: var(--ink-2); }
.done .pts { color: var(--pink-deep); }
.opt .nm::after { content: " · bonus"; color: var(--violet); font-weight: 700; font-size: 13px; }
.chips2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.pill2 { min-height: 36px; padding: 0 12px; border-radius: 99px; background: var(--soft); font-size: 13.5px; font-weight: 700; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; }
.pill2[aria-pressed="true"] { background: var(--violet); color: #fff; }
.drops { display: flex; gap: 8px; margin-top: 6px; }
.drop { width: 34px; height: 34px; border-radius: 50%; background: var(--soft); display: grid; place-items: center; font-size: 15px; filter: grayscale(1); opacity: .55; }
.drop.on { background: #DDF8FD; filter: none; opacity: 1; box-shadow: inset 0 0 0 2px var(--cyan); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 20px; border-radius: 999px; font-weight: 800; font-size: 15.5px; }
.btn.go { background: var(--pink); color: #fff; box-shadow: 0 8px 20px -8px var(--pink); }
.btn.dark { background: var(--ink); color: #fff; }
.btn.line { box-shadow: inset 0 0 0 2px var(--line); }
.btn.white { background: #fff; color: var(--ink); }
.btn.ghostw { box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); color: #fff; }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 14px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.btns .btn { flex: 1 1 0; }

.quote { font-size: 15px; color: var(--ink-2); font-style: italic; }
.heroOut .lv, .hero .lv { font-size: 13px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; opacity: .9; }
.heroOut .st { font-family: var(--display); font-weight: 700; font-size: 20px; line-height: 1.3; text-wrap: balance; }
.heroOut .meta { font-size: 14px; font-weight: 600; opacity: .95; }
.clock { font-family: var(--display); font-weight: 700; font-size: 54px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.ground { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; font-size: 15px; font-weight: 600; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; color: #3E6B00; background: #EAFBC9; border-radius: 99px; padding: 3px 9px; white-space: nowrap; }
.notice { display: grid; gap: 10px; padding: 16px; border-radius: 20px; background: #F3FCE2; box-shadow: inset 0 0 0 2px var(--lime); font-size: 15px; font-weight: 600; }
.ladder, .logs { list-style: none; margin: 0; padding: 0; }
.ladder li, .logs li { border-bottom: 1px solid var(--line); }
.ladder li:last-child, .logs li:last-child { border-bottom: 0; }
.lrow { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 10px 2px; text-align: left; }
.lrow .n { flex: none; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 13px; font-weight: 800; color: var(--ink-2); background: var(--soft); font-variant-numeric: tabular-nums; }
.lrow .n svg { width: 14px; height: 14px; }
.lrow.past .n { background: var(--lime); color: var(--ink); }
.lrow.cur .n { background: var(--pink); color: #fff; box-shadow: 0 0 12px rgba(255,46,147,.6); }
.lrow .t { flex: 1; min-width: 0; font-size: 15px; }
.lrow.ahead .t { color: var(--ink-2); }
.lrow.cur .t { font-weight: 800; }
.lrow .c { flex: none; font-size: 13px; font-weight: 700; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.lact { padding: 0 0 12px 42px; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
.sw.pb { background: var(--pink); }
.sw.pe { background: var(--blue); }
.chartwrap { position: relative; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; }
.chart .ax { fill: var(--ink-3); font-size: 11px; font-family: var(--body); }
.chart .stem { stroke: #D9D6E6; stroke-width: 2; stroke-linecap: round; }
.chart .pb { fill: var(--pink); stroke: #fff; stroke-width: 2; }
.chart .pe { fill: var(--blue); stroke: #fff; stroke-width: 2; }
.chart .dl { fill: var(--ink-2); font-size: 11.5px; font-weight: 700; font-family: var(--body); }
.chart .hit { fill: transparent; cursor: pointer; }
.chart .hl { fill: var(--soft); }
.tip { position: absolute; top: -6px; transform: translate(-50%, -100%); background: var(--ink); color: #fff; font-size: 13px; padding: 8px 10px; border-radius: 10px; pointer-events: none; white-space: pre; z-index: 2; }
.logs button { width: 100%; text-align: left; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 2px; }
.logs .a { font-size: 15px; font-weight: 700; }
.logs .b { font-size: 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.logs .c { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); }
.logs .d { grid-column: 1 / -1; font-size: 14px; color: var(--ink-2); font-style: italic; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.early { color: var(--pink-deep); font-weight: 700; }
.empty { font-size: 14.5px; color: var(--ink-3); }

.bal { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.lvl { display: grid; gap: 6px; font-size: 14px; font-weight: 700; }
.rw { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rcard { display: grid; gap: 10px; padding: 14px; border-radius: 20px; background: var(--soft); }
.rcard.can { background: #FFF0F7; box-shadow: inset 0 0 0 2px var(--pink); }
.rtop { display: flex; align-items: center; gap: 12px; }
.rtop .tile { width: 44px; height: 44px; font-size: 22px; background: #fff; }
.rtop .nm { font-size: 16px; }
.rbar { height: 6px; border-radius: 6px; background: #E4E2EE; overflow: hidden; }
.rbar i { display: block; height: 100%; border-radius: 6px; background: var(--glow); }
.redit { display: grid; grid-template-columns: 52px 1fr 86px 34px; gap: 6px; align-items: center; }
.earn { list-style: none; margin: 0; padding: 0; columns: 2; column-gap: 16px; font-size: 14px; color: var(--ink-2); }
.earn li { break-inside: avoid; padding: 3px 0; display: flex; justify-content: space-between; gap: 8px; }
.earn b { color: var(--ink); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.stat { display: grid; gap: 2px; padding: 12px; border-radius: 16px; background: var(--soft); }
.stat b { font-family: var(--display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12.5px; color: var(--ink-2); line-height: 1.3; font-weight: 600; }
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.cal .hd { font-size: 11px; font-weight: 800; color: var(--ink-3); text-align: center; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 10px; background: var(--soft); position: relative; display: grid; place-items: center; font-size: 12px; font-weight: 600; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.cell.l1 { background: #FFD6EA; }
.cell.l2 { background: #FF9CCB; color: var(--ink); }
.cell.l3 { background: #FF5FAA; color: #fff; }
.cell.l4 { background: var(--pink); color: #fff; box-shadow: 0 0 10px rgba(255,46,147,.5); }
.cell.off { background: repeating-linear-gradient(135deg, #E3F9FD 0 4px, #fff 4px 8px); color: var(--ink-3); }
.cell.fut, .cell.pre { background: transparent; color: var(--ink-3); cursor: default; }
.cell.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.cell .o { position: absolute; right: 4px; top: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1.5px #fff; }
.calkey { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.calkey span { display: inline-flex; align-items: center; gap: 6px; }
.calkey i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wkc { display: grid; justify-items: center; gap: 4px; }
.wl { font-size: 11.5px; font-weight: 800; color: var(--ink-3); }
.wp { font-size: 11.5px; font-weight: 700; color: var(--ink-2); min-height: 16px; }
.dr { position: relative; width: 100%; max-width: 100%; aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; }
.dr svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.dr .trk { fill: none; stroke: #ECEAF3; stroke-width: 3.6; }
.dr .arc { fill: none; stroke: var(--pink); stroke-width: 3.6; stroke-linecap: round; transition: stroke-dashoffset .5s ease; }
.dr .arc.rest { stroke: var(--violet); }
.dr.full .trk { fill: #FFE6F2; }
.dr.full .arc { filter: drop-shadow(0 0 3px rgba(255, 46, 147, .65)); }
.dr.off .trk { stroke: var(--cyan); stroke-dasharray: 2.5 3; fill: #F1FCFE; }
.dr.fut .trk, .dr.pre .trk { stroke: #F4F3F8; }
.dr .dn { position: relative; font-size: 12.5px; font-weight: 700; color: var(--ink-2); }
.dr.full .dn { color: var(--pink-deep); font-weight: 800; }
.dr.fut .dn, .dr.pre .dn { color: #C9C7D6; font-weight: 500; }
.dr.today .dn { color: var(--ink); font-weight: 800; }
.dr.today::after { content: ""; position: absolute; bottom: -5px; width: 5px; height: 5px; border-radius: 50%; background: var(--ink); }
.dr .wo { position: absolute; right: 2%; top: 2%; width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 0 1.5px #fff, 0 0 6px var(--lime); }
.wkc .dr .dn { font-size: 14px; }
.stats4 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.mcard { padding: 16px 14px; border-radius: 24px; background: #fff; box-shadow: 0 0 0 1px var(--line), 0 10px 30px -18px rgba(139, 92, 255, .45); }
.mhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.mname { font-family: var(--display); font-size: 16px; font-weight: 700; }
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 9px 7px; }
.mgrid .hd { font-size: 11px; font-weight: 800; color: var(--ink-3); text-align: center; }
.rkey { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-2); font-weight: 600; }
.rkey span { display: inline-flex; align-items: center; gap: 6px; }
.kr { width: 13px; height: 13px; border-radius: 50%; display: inline-block; box-shadow: inset 0 0 0 2.5px #ECEAF3; }
.kr.full { box-shadow: inset 0 0 0 2.5px var(--pink); background: #FFE6F2; }
.kr.half { background: conic-gradient(var(--pink) 0 50%, #ECEAF3 50% 100%); box-shadow: none; -webkit-mask: radial-gradient(circle, transparent 3.5px, #000 4px); mask: radial-gradient(circle, transparent 3.5px, #000 4px); }
.kr.rest { box-shadow: inset 0 0 0 2.5px var(--violet); }
.kr.off { box-shadow: none; border: 2px dashed var(--cyan); }
.kw { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--lime); }
.rsum { display: grid; gap: 6px; padding: 16px; border-radius: 20px; background: var(--glow); color: #fff; }
.rsum b { font-family: var(--display); font-size: 26px; }
.rsum span { font-weight: 600; font-size: 14px; }
.lbar { display: block; height: 6px; border-radius: 6px; background: rgba(255,255,255,.3); overflow: hidden; }
.lbar i { display: block; height: 100%; background: #fff; border-radius: 6px; }
details.earnbox summary { cursor: pointer; font-weight: 800; font-size: 15px; color: var(--violet); list-style: none; padding: 6px 0; }
details.earnbox summary::-webkit-details-marker { display: none; }
details.earnbox[open] { display: grid; gap: 8px; }
.hist { list-style: none; margin: 0; padding: 0; font-size: 14px; color: var(--ink-2); display: grid; gap: 6px; }

.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 4px; padding: 10px 0; border-radius: 16px; font-size: 12px; font-weight: 800; }
.wd .e { font-size: 20px; line-height: 1; }
.wd.train { background: #FFE6F2; color: var(--pink-deep); }
.wd.rest { background: #EEE7FF; color: #5B2FD6; }
.wd.off { background: #DFF8FD; color: #0B7A8F; }
.key { display: grid; gap: 6px; font-size: 14px; color: var(--ink-2); }
.key b { color: var(--ink); }
.rows { list-style: none; margin: 0; padding: 0; }
.rows li, .rowline { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 58px; border-bottom: 1px solid var(--line); }
.rows li:last-child { border-bottom: 0; }
.rows li > span:first-child, .rowline > span:first-child { font-weight: 600; }
.stepper { display: flex; align-items: center; gap: 6px; }

      case "selstep": { var si = Number(b.dataset.i); ui.selStep = ui.selStep === si ? null : si; render(); break; }

      case "moveup": s.step = Math.min(s.ladder.length - 1, s.step + 1); s.snooze = null; s.stepUps.push({ step: s.step, t: Date.now() }); persist("settings"); render(); confetti(); toast("🪜 Step " + (s.step + 1) + "! +100 ⚡"); break;
      case "snooze": s.snooze = { step: s.step, count: logsAtStep(s.step).filter(function (l) { return !l.early; }).length }; persist("settings"); render(); break;
      case "claim": ui.claim = b.dataset.id; render(); break;
      case "claimno": ui.claim = null; render(); break;
      case "claimyes": {
        var r = s.rewards.filter(function (x) { return x.id === b.dataset.id; })[0];
        if (r && totals().balance >= r.cost) { s.claims.push({ rid: r.id, emoji: r.emoji, name: r.name, cost: r.cost, t: Date.now() }); persist("settings"); ui.claim = null; render(); confetti(); toast(r.emoji + " Enjoy it. You earned it."); }
        break;
      }
      case "editrw": ui.editRewards = !ui.editRewards; ui.claim = null; render(); break;
      case "rwadd": s.rewards.push({ id: uid(), emoji: "🎁", name: "New reward", cost: 1000 }); persist("settings"); render(); break;
      case "rwdel": s.rewards.splice(Number(b.dataset.i), 1); persist("settings"); render(); break;
      case "fitadj": { var nf = clamp(fitInfo(todayKey()).lvl + Number(b.dataset.d), 0, FIT.length - 1); s.fitAdj = (Number(s.fitAdj) || 0) + (nf - fitInfo(todayKey()).lvl); persist("settings"); render(); toast("💪 Now on fitness level " + (nf + 1)); break; }
      case "bkcopy": {
        ui.bkCode = makeCode(); ui.bkIn = false;
        var shown = function () { ui.bkShow = true; render(); var o = $("#bk-out"); if (o) { o.focus(); o.select(); } };
        try { navigator.clipboard.writeText(ui.bkCode).then(function () { ui.bkShow = false; render(); toast("💾 Backup code copied"); }, shown); } catch (er) { shown(); }
        break;
      }
      case "bkpaste": ui.bkIn = true; ui.bkShow = false; render(); setTimeout(function () { var el = $("#bk-in"); if (el) el.focus(); }, 20); break;
      case "bkcancel": ui.bkIn = false; render(); break;
      case "bkimport": {
        var o2;
        try { o2 = readCode($("#bk-in").value); } catch (er2) { toast("That code didn't work. Copy the whole thing again."); break; }
        var gone = Object.keys(S.days);
        S.settings = mergeSettings(o2.settings); S.settings.epoch = Date.now(); S.days = o2.days || {};
        persist("settings");
        Object.keys(S.days).forEach(function (dk) { persist("d-" + dk); });
        gone.forEach(function (dk) { if (!S.days[dk]) persist("d-" + dk); });
        ui.bkIn = false; ui.date = todayKey(); render(); confetti(); toast("💾 All imported");
        break;
      }
      case "wdcycle": { var wd = Number(b.dataset.wd), order = ["train", "rest", "off"]; s.week[wd] = order[(order.indexOf(s.week[wd]) + 1) % 3]; persist("settings"); render(); break; }
      case "adj": { var key = b.dataset.k, lim = { flexPerWeek: [0, 3], squats: [5, 300], waterGoal: [2, 12], stepsGoal: [1000, 30000] }[key]; s[key] = clamp((Number(s[key]) || 0) + Number(b.dataset.d), lim[0], lim[1]); persist("settings"); render(); break; }
      case "lddel": { var di = Number(b.dataset.i); if (s.ladder.length <= 2) break; s.ladder.splice(di, 1); s.prior.splice(di, 1); if (s.step >= s.ladder.length) s.step = s.ladder.length - 1; else if (di < s.step) s.step--; persist("settings"); render(); break; }
      case "ldadd": s.ladder.push("New step"); s.prior.push(false); persist("settings"); render(); setTimeout(function () { var el = $("#ld-" + (s.ladder.length - 1)); if (el) { el.focus(); el.select(); } }, 20); break;
      case "ldreset": { if (b.dataset.yes) { s.ladder = LADDER_DEFAULT.slice(); s.prior = PRIOR_DEFAULT.slice(); s.step = clamp(s.step, 0, s.ladder.length - 1); ui.confirmReset = false; persist("settings"); } else ui.confirmReset = !b.dataset.no; render(); break; }
      case "fresh": {
        if (!b.dataset.yes) { ui.confirmFresh = !b.dataset.no; render(); break; }
        var oldDays = Object.keys(S.days);
        S.days = {}; s.start = addDays(todayKey(), 1); s.epoch = Date.now(); s.snooze = null; s.claims = []; s.stepUps = []; ui.confirmFresh = false;
        persist("settings"); oldDays.forEach(function (dk) { persist("d-" + dk); });
        ui.date = todayKey(); render(); toast("🌱 Fresh start from tomorrow"); break;
      }
    }
  });
  document.addEventListener("change", function (e) {
    var el = e.target, s = S.settings, set = el.dataset && el.dataset.set;
    if (!set) return;
    if (set === "ladder") { var v = el.value.trim().slice(0, 140); if (v) { s.ladder[Number(el.dataset.i)] = v; persist("settings"); } else el.value = s.ladder[Number(el.dataset.i)]; }
    else if (set === "med") { var arr = s.meds[el.dataset.g], m = arr && arr[Number(el.dataset.i)], mv = el.value.trim().slice(0, 60); if (!m) return; if (mv) { m.name = mv; persist("settings"); } else el.value = m.name; }
    else if (set === "pmtime") { if (/^\d\d:\d\d$/.test(el.value)) { s.meds.pmTime = el.value; persist("settings"); } }
    else if (set === "prize") { if (s.couple) { s.couple.prize = el.value.trim().slice(0, 160); persist("settings"); toast("Prize saved"); } }
    else if (set === "rw") {
      var r = s.rewards[Number(el.dataset.i)], f = el.dataset.f;
      if (!r) return;
      if (f === "cost") r.cost = clamp(Math.round(Number(el.value) || 0), 50, 100000);
      else if (el.value.trim()) r[f] = el.value.trim().slice(0, f === "emoji" ? 8 : 60);
      persist("settings");
    }
  });
  document.addEventListener("input", function (e) {
    var el = e.target;
    if (el.type === "range" && el.id.indexOf("f-") === 0) { var o = $("#o-" + el.id.slice(2)); if (o) o.textContent = el.value; }
    if (el.id === "f-mins") document.querySelectorAll("[data-mins]").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.mins === el.value)); });
  });
  document.addEventListener("pointerover", function (e) { var tp = e.target.closest && e.target.closest("[data-tip]"); if (tp && e.pointerType === "mouse") showTip(Number(tp.dataset.tip)); });
  document.addEventListener("pointerout", function (e) {
    if (e.pointerType !== "mouse") return;
    var tp = e.target.closest && e.target.closest("[data-tip]");
    if (tp && !(e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest("[data-tip]"))) hideTip();
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

  setInterval(function () {
    if (timer) document.querySelectorAll(".js-clock").forEach(function (c) { c.textContent = clockText(); });
    var now = new Date(), t = todayKey(), m = now.getHours() * 60 + now.getMinutes();
    var idle = $("#sheet").hidden && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
    if (t !== lastToday) { if (ui.date === lastToday) ui.date = t; lastToday = t; if (idle) render(); }
    else if (m !== lastMin) { lastMin = m; if (idle && ui.tab === "today") { if (pmDue(ui.date) !== !!document.querySelector(".alert")) render(); } }
  }, 1000);

  setInterval(function () { if (coupleOn() && document.visibilityState === "visible") pullCouple(); }, 20000);
  document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible" && coupleOn()) pushCouple().then(pullCouple); });

  /* ---------- boot ---------- */
  var cached = lsRead(LS_KEY);
  if (cached && cached.settings) { S.settings = mergeSettings(cached.settings); S.days = cached.days || {}; }
  if (!S.settings.start) S.settings.start = todayKey();
  timer = lsRead(LS_TIMER);
  if (timer && (typeof timer.start !== "number" || Date.now() - timer.start > 6 * 3600 * 1000)) { timer = null; lsWrite(LS_TIMER, null); }
  var hsh = (location.hash || "").slice(1);
  if (VIEWS[hsh]) ui.tab = hsh;
  render();
  connect();
  if (coupleOn()) pushCouple().then(pullCouple);
})();
</script>
